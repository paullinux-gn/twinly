name: Native tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 poppler-utils xvfb desktop-file-utils appstream

      - name: Install vault dependencies
        run: |
          python3 -m pip install --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/twinly-crypto" -r packaging/vault-requirements.txt

      - name: Test and rebuild local document engine
        run: |
          npm ci --prefix web --ignore-scripts
          npm test --prefix web
          npm run build --prefix web
          git diff --exit-code -- web/editor.bundle.js

      - name: Check packaging
        run: |
          python3 scripts/check_release.py
          desktop-file-validate data/io.github.paullinux_gn.Twinly.desktop

      - name: Run tests
        env:
          GSK_RENDERER: cairo
          G_DEBUG: fatal-criticals
          PYTHONPATH: ${{ runner.temp }}/twinly-crypto
        run: |
          python3 -c 'import vault; vault.crypto()'
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
