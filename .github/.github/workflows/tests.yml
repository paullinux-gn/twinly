name: Native tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install GTK test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip python3-gi python3-cairo python3-gi-cairo gir1.2-gtk-4.0 gir1.2-adw-1 xvfb desktop-file-utils appstream
      - name: Install pinned vault test dependencies
        run: python3 -m pip install --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/twinly-crypto" -r packaging/vault-requirements.txt
      - name: Check packaging and desktop entry
        run: |
          python3 -m compileall -q .
          python3 scripts/check_release.py
          desktop-file-validate data/io.github.twinly.Preview.desktop
      - name: Run native tests
        env:
          GSK_RENDERER: cairo
          G_DEBUG: fatal-criticals
          PYTHONPATH: ${{ runner.temp }}/twinly-crypto
        run: |
          python3 -c 'import vault; vault.crypto()'
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -v
